@if (user(); as u) {
  <div class="home">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <header class="topbar">
      <div class="brand">
        <span class="logo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <span class="brand-name">AuthApp</span>
      </div>
      <button class="btn-ghost" type="button" (click)="logout()">Log out</button>
    </header>

    <main class="content">
      <section class="hero">
        <div class="avatar">{{ initials() }}</div>
        <p class="greeting">{{ greeting() }} 👋</p>
        <h1>
          Welcome, <span class="gradient">{{ u.name }}</span>
        </h1>
        <p class="lead">
          You're signed in. Your session is saved, so you'll stay logged in even after a refresh.
        </p>
      </section>

      <section class="cards">
        @for (d of details(); track d.label; let i = $index) {
          <article class="card" [style.animation-delay]="0.4 + i * 0.1 + 's'">
            <span class="card-label">{{ d.label }}</span>
            <span class="card-value">{{ d.value }}</span>
          </article>
        }
      </section>
    </main>
  </div>
}
